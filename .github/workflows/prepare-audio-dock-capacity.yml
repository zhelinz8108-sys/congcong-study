name: Retain two exact oldest snapshots for removing the audio dock

on:
  push:
    branches: [ops/prepare-english-audio-dock-20261025]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'zhelinz8108-sys/congcong-study' && github.ref == 'refs/heads/ops/prepare-english-audio-dock-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Check only new exact-roster budgets and completed-stage reentry
        run: python3 -B scripts/test-audio-dock-capacity-plan.py
      - name: Retain only the reviewed two oldest snapshots on root disk
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$SERVER_HOST" = 124.223.31.175
          test "$SERVER_USER" = ubuntu
          test "$SERVER_PORT" = 22
          test -n "$SERVER_SSH_KEY"
          work_dir="$(mktemp -d "$RUNNER_TEMP/audio-dock-retention.XXXXXXXX")"
          trap 'rm -f -- "$work_dir/key" "$work_dir/prepare.py"; rmdir -- "$work_dir"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$work_dir/key"
          python3 -B - "$work_dir/prepare.py" <<'PY'
          import base64,pathlib,sys
          code='import base64,types\n'
          for variable,filename in [('BASE','probe-english-six-deployment.py'),('CACHE','probe-retained-compile-cache.py'),('RESTORE','restore-retained-compressed-release.py'),('CORE','prepare-english-six-capacity.py')]:
              raw=base64.b64encode(pathlib.Path('scripts',filename).read_bytes()).decode('ascii')
              code+=variable+'=types.ModuleType('+repr('reviewed_'+variable)+')\n'
              if variable=='CACHE': code+='CACHE.__dict__["BASE"]=BASE\n'
              if variable=='CORE': code+='CORE.__dict__.update(BASE=BASE,CACHE=CACHE,RESTORE=RESTORE)\n'
              code+='exec(base64.b64decode('+repr(raw)+'),'+variable+'.__dict__)\n'
              if variable=='RESTORE': code+='RESTORE_SOURCE=base64.b64decode('+repr(raw)+')\n'
          code+=pathlib.Path('scripts/prepare-audio-dock-capacity.py').read_text()
          pathlib.Path(sys.argv[1]).write_text(code)
          PY
          ssh -i "$work_dir/key" -p "$SERVER_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile=study-plan/scripts/cloud-recovery/known_hosts \
            -o GlobalKnownHostsFile=/dev/null -o LogLevel=ERROR \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo -n nice -n 15 ionice -c 3 python3 -B - --apply" < "$work_dir/prepare.py"
