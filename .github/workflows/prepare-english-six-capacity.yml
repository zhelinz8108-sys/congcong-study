name: Prepare English knowledge release with verified private rollback retention

on:
  push:
    branches: [ops/prepare-english-six-capacity-20261025]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'zhelinz8108-sys/congcong-study' && github.ref == 'refs/heads/ops/prepare-english-six-capacity-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Test exact cleanup guards, complete archive verification and safe recovery offline
        env:
          ENGLISH_CAPACITY_DIAGNOSE_SYNTHETIC_ATIME: '1'
        run: |
          python3 -B scripts/probe-english-six-deployment.py --self-test
          python3 -B scripts/probe-retained-compile-cache.py --self-test
          python3 -B scripts/test-restore-retained-compressed-release.py
          python3 -B scripts/test-prepare-english-six-capacity.py
      - name: Prepare only the reviewed inactive webpack caches and complete private compressed snapshot
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$SERVER_HOST" = 124.223.31.175
          test "$SERVER_USER" = ubuntu
          test "$SERVER_PORT" = 22
          test -n "$SERVER_SSH_KEY"
          work_dir="$(mktemp -d "$RUNNER_TEMP/english-capacity.XXXXXXXX")"
          trap 'rm -f -- "$work_dir/key" "$work_dir/prepare.py"; rmdir -- "$work_dir"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$work_dir/key"
          python3 -B - "$work_dir/prepare.py" <<'PY'
          import base64, pathlib, sys
          code = 'import base64,types\n'
          for variable, filename in [('BASE','probe-english-six-deployment.py'), ('CACHE','probe-retained-compile-cache.py'), ('RESTORE','restore-retained-compressed-release.py')]:
              raw = pathlib.Path('scripts', filename).read_bytes()
              encoded = base64.b64encode(raw).decode('ascii')
              code += variable + '=types.ModuleType(' + repr('reviewed_' + variable) + ')\n'
              if variable == 'CACHE':
                  code += 'CACHE.__dict__["BASE"]=BASE\n'
              code += 'exec(base64.b64decode(' + repr(encoded) + '),' + variable + '.__dict__)\n'
              if variable == 'RESTORE':
                  code += 'RESTORE_SOURCE=base64.b64decode(' + repr(encoded) + ')\n'
          code += pathlib.Path('scripts/prepare-english-six-capacity.py').read_text()
          pathlib.Path(sys.argv[1]).write_text(code)
          PY
          ssh -i "$work_dir/key" -p "$SERVER_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile=study-plan/scripts/cloud-recovery/known_hosts \
            -o GlobalKnownHostsFile=/dev/null -o LogLevel=ERROR \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo -n nice -n 15 ionice -c 3 python3 -B - --apply" < "$work_dir/prepare.py"
