name: Read-only English knowledge capacity and public encryption key

on:
  push:
    branches: [ops/preflight-english-six-knowledge-20261025]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'zhelinz8108-sys/congcong-study' && github.ref == 'refs/heads/ops/preflight-english-six-knowledge-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify stat-only storage and public-only cryptography using invented data
        run: |
          python3 -B scripts/probe-english-six-deployment.py --self-test
          node scripts/export-english-six-production-public-key.mjs --self-test
      - name: Read only safe storage counters and retained public build identities
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$SERVER_HOST" = 124.223.31.175
          test "$SERVER_USER" = ubuntu
          test "$SERVER_PORT" = 22
          test -n "$SERVER_SSH_KEY"
          work_dir="$(mktemp -d "$RUNNER_TEMP/english-knowledge-preflight.XXXXXXXX")"
          trap 'rm -f -- "$work_dir/key"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$work_dir/key"
          options=(-i "$work_dir/key" -p "$SERVER_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=study-plan/scripts/cloud-recovery/known_hosts -o GlobalKnownHostsFile=/dev/null -o LogLevel=ERROR -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30)
          ssh "${options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "sudo -n python3 -B -" < scripts/probe-english-six-deployment.py
      - name: Emit only the purpose-separated English knowledge public encryption key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$SERVER_HOST" = 124.223.31.175
          test "$SERVER_USER" = ubuntu
          test "$SERVER_PORT" = 22
          test -n "$SERVER_SSH_KEY"
          work_dir="$(mktemp -d "$RUNNER_TEMP/english-knowledge-public-key.XXXXXXXX")"
          trap 'rm -f -- "$work_dir/key"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$work_dir/key"
          unit="study-plan-public-english-key-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i "$work_dir/key" -p "$SERVER_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile=study-plan/scripts/cloud-recovery/known_hosts \
            -o GlobalKnownHostsFile=/dev/null -o LogLevel=ERROR \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo -n systemd-run --quiet --wait --collect --pipe --unit='$unit' --uid=ubuntu --gid=ubuntu --working-directory=/www/study-plan --property=EnvironmentFile=-/etc/study-plan.env --property=RuntimeMaxSec=60 --setenv=NODE_ENV=production /usr/bin/node --input-type=module -" \
            < scripts/export-english-six-production-public-key.mjs
