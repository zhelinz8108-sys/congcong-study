name: Read-only retained release compression and reuse sizing

on:
  push:
    branches: [ops/size-retained-english-compression-20261025]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  sizing:
    if: github.repository == 'zhelinz8108-sys/congcong-study' && github.ref == 'refs/heads/ops/size-retained-english-compression-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Test read-only manifest comparison and compressed streams on synthetic files
        run: |
          python3 -B scripts/probe-english-six-deployment.py --self-test
          python3 -B scripts/size-retained-english-deployment.py --self-test
      - name: Count only gzip streams and matching archived bytes for two pinned inactive copies
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$SERVER_HOST" = 124.223.31.175
          test "$SERVER_USER" = ubuntu
          test "$SERVER_PORT" = 22
          test -n "$SERVER_SSH_KEY"
          work_dir="$(mktemp -d "$RUNNER_TEMP/retained-sizing.XXXXXXXX")"
          trap 'rm -f -- "$work_dir/key" "$work_dir/probe.py"; rmdir -- "$work_dir"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$work_dir/key"
          python3 -B - "$work_dir/probe.py" <<'PY'
          import base64, pathlib, sys
          helper = base64.b64encode(pathlib.Path('scripts/probe-english-six-deployment.py').read_bytes()).decode('ascii')
          code = 'import base64,types\nBASE=types.ModuleType("storage_probe")\nexec(base64.b64decode(' + repr(helper) + '), BASE.__dict__)\n'
          code += pathlib.Path('scripts/size-retained-english-deployment.py').read_text()
          pathlib.Path(sys.argv[1]).write_text(code)
          PY
          ssh -i "$work_dir/key" -p "$SERVER_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile=study-plan/scripts/cloud-recovery/known_hosts \
            -o GlobalKnownHostsFile=/dev/null -o LogLevel=ERROR \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo -n nice -n 15 ionice -c 3 python3 -B -" < "$work_dir/probe.py"
