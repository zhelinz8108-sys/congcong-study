name: Deploy to Tencent Lighthouse

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never interrupt a release between stopping the service and its health check.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      RELEASE_NAME: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_RELEASE_DIR: /www/study-plan-releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test isolated release seeding with synthetic files
        shell: bash
        env:
          SERVER_HOST: ''
          SERVER_USER: ''
          SERVER_PORT: ''
          SERVER_SSH_KEY: ''
        run: |
          set -euo pipefail
          unset SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY
          python3 -B scripts/test-seed-release-upload.py
          python3 -B scripts/test-archive-failed-release-stages.py

      - name: Check deployment secrets
        shell: bash
        run: |
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not configured."
              exit 1
            fi
          done

      - name: Ensure rsync is available
        shell: bash
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Archive only this task's unused failed stages with full verification
        shell: bash
        run: |
          set -euo pipefail
          archive_code="$(base64 -w0 scripts/archive-failed-release-stages.py)"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "sudo -n python3 -c 'import base64;exec(compile(base64.b64decode(\"$archive_code\"),\"<archive-failed-stages>\",\"exec\"))' --apply"

      - name: Prepare isolated release directory
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "
            set -e
            sudo install -d -m 0755 -o ubuntu -g ubuntu /www/study-plan-releases
            test ! -e '$REMOTE_RELEASE_DIR'
            install -d -m 0755 '$REMOTE_RELEASE_DIR'
          "

      - name: Seed tracked regular files from the current release into the empty stage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          manifest="$RUNNER_TEMP/release-seed-$RELEASE_NAME.nul"
          python3 scripts/seed-release-upload.py manifest --output "$manifest"
          seed_code="$(base64 -w0 scripts/seed-release-upload.py)"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "python3 -c 'import base64;exec(compile(base64.b64decode(\"$seed_code\"),\"<release-seed>\",\"exec\"))' seed --release '$RELEASE_NAME'" < "$manifest"
          rm -f -- "$manifest"
      - name: Upload release without touching the running application
        shell: bash
        run: |
          rsync -az --checksum \
            -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT" \
            --exclude ".env*" \
            --exclude ".data/" \
            --exclude "node_modules/" \
            --exclude ".next/" \
            --exclude ".next-*/" \
            --exclude "*.log" \
            --exclude "public/listening/" \
            --exclude "public/uploads/" \
            --exclude "content/english-six" \
            --exclude "content/toefl-listening/" \
            study-plan/ "$SERVER_USER@$SERVER_HOST:$REMOTE_RELEASE_DIR/"

      - name: Build, verify, and activate with rollback
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "sudo -n bash '$REMOTE_RELEASE_DIR/scripts/release-production.sh' '$RELEASE_NAME' '$GITHUB_SHA'"
