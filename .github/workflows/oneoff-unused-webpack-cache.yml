name: One-time unused webpack cache cleanup

on:
  push:
    branches:
      - maintenance/unused-webpack-cache-20261116
    paths:
      - scripts/cleanup-unused-webpack-cache.py
      - scripts/test-cleanup-unused-webpack-cache.py
      - .github/workflows/oneoff-unused-webpack-cache.yml

permissions:
  contents: read

concurrency:
  group: oneoff-unused-webpack-cache-20261116
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'zhelinz8108-sys/congcong-study' && github.ref == 'refs/heads/maintenance/unused-webpack-cache-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check bounded compiler-cache cleanup with synthetic files
        run: python3 -B scripts/test-cleanup-unused-webpack-cache.py
      - name: Remove only inactive compiler-cache files while archive preparation runs
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test "$SERVER_HOST" = 124.223.31.175
          test "$SERVER_USER" = ubuntu
          [[ "$SERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$SERVER_PORT" -ge 1
          test "$SERVER_PORT" -le 65535
          test -n "$SERVER_SSH_KEY"
          cleanup_key="$RUNNER_TEMP/unused-webpack-key"
          cleanup_hosts="$RUNNER_TEMP/unused-webpack-known-hosts"
          trap 'rm -f -- "$cleanup_key" "$cleanup_hosts"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$cleanup_key"
          cp study-plan/scripts/cloud-recovery/known_hosts "$cleanup_hosts"
          cleanup_host_key="$(awk '$1 == "124.223.31.175" && $2 == "ssh-ed25519" {print $3}' "$cleanup_hosts")"
          test -n "$cleanup_host_key"
          printf '[%s]:%s ssh-ed25519 %s\n' "$SERVER_HOST" "$SERVER_PORT" "$cleanup_host_key" >> "$cleanup_hosts"
          ssh -i "$cleanup_key" -p "$SERVER_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=$cleanup_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            "$SERVER_USER@$SERVER_HOST" "sudo -n python3 - --apply" < scripts/cleanup-unused-webpack-cache.py
