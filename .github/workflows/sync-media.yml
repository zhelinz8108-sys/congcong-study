name: Sync listening media

on:
  push:
    branches:
      - main
    paths:
      - "study-plan/public/listening/**"
      - ".github/workflows/sync-media.yml"
  workflow_dispatch:

concurrency:
  group: production-media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      REMOTE_MEDIA_DIR: /www/study-plan/public/listening
      MEDIA_BASE_URL: https://media.githubusercontent.com/media/${{ github.repository }}/${{ github.sha }}/study-plan/public/listening

    steps:
      - name: Checkout media manifest source
        uses: actions/checkout@v4

      - name: Build LFS verification manifest
        shell: bash
        run: |
          : > media-manifest.tsv
          while IFS= read -r file; do
            pointer="$(git show "$GITHUB_SHA:$file")"
            oid="$(printf '%s\n' "$pointer" | sed -n 's/^oid sha256://p')"
            size="$(printf '%s\n' "$pointer" | sed -n 's/^size //p')"
            relative_path="${file#study-plan/public/listening/}"
            if [ -z "$oid" ] || [ -z "$size" ] || [ "$relative_path" = "$file" ]; then
              echo "::error::Invalid Git LFS pointer: $file"
              exit 1
            fi
            printf '%s\t%s\t%s\n' "$relative_path" "$oid" "$size" >> media-manifest.tsv
          done < <(git ls-tree -r --name-only "$GITHUB_SHA" -- study-plan/public/listening)
          test -s media-manifest.tsv
          echo "Media objects in manifest: $(wc -l < media-manifest.tsv)"

      - name: Check deployment secrets
        shell: bash
        run: |
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not configured."
              exit 1
            fi
          done

      - name: Ensure rsync is available
        shell: bash
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload manifest and sync helper
        shell: bash
        run: |
          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
            media-manifest.tsv study-plan/scripts/sync-listening-media.sh \
            "$SERVER_USER@$SERVER_HOST:/tmp/"

      - name: Download and verify media on server
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "bash /tmp/sync-listening-media.sh /tmp/media-manifest.tsv '$MEDIA_BASE_URL' '$REMOTE_MEDIA_DIR' 8"

      - name: Remove temporary sync files
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "rm -f /tmp/media-manifest.tsv /tmp/sync-listening-media.sh" || true
