<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 110" width="100%" style="max-width:270px" role="img" aria-label="线段比例尺：每一段长 0.5 厘米，刻度依次是 0、25、50、75 米" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="270" height="110" fill="#ffffff"/>
<line x1="40" y1="60" x2="190" y2="60" stroke="#1f2937" stroke-width="1.5"/>
<line x1="40" y1="55" x2="40" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="40" y="51" font-size="12" text-anchor="middle" fill="#1f2937">0</text>
<line x1="90" y1="55" x2="90" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="90" y="51" font-size="12" text-anchor="middle" fill="#1f2937">25</text>
<line x1="140" y1="55" x2="140" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="140" y="51" font-size="12" text-anchor="middle" fill="#1f2937">50</text>
<line x1="190" y1="55" x2="190" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="190" y="51" font-size="12" text-anchor="middle" fill="#1f2937">75 米</text>
<text x="115.0" y="90.0" font-size="12" text-anchor="middle" fill="#475569">每一段长 0.5 厘米</text>
</svg>