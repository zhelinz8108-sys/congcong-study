<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="100%" style="max-width:360px" role="img" aria-label="线段比例尺：每一段长 2 厘米，刻度依次是 0、50、100、150 米" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="360" height="110" fill="#ffffff"/>
<line x1="40" y1="60" x2="280" y2="60" stroke="#1f2937" stroke-width="1.5"/>
<line x1="40" y1="55" x2="40" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="40" y="51" font-size="12" text-anchor="middle" fill="#1f2937">0</text>
<line x1="120" y1="55" x2="120" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="120" y="51" font-size="12" text-anchor="middle" fill="#1f2937">50</text>
<line x1="200" y1="55" x2="200" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="200" y="51" font-size="12" text-anchor="middle" fill="#1f2937">100</text>
<line x1="280" y1="55" x2="280" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="280" y="51" font-size="12" text-anchor="middle" fill="#1f2937">150 米</text>
<text x="160.0" y="90.0" font-size="12" text-anchor="middle" fill="#475569">每一段长 2 厘米</text>
</svg>