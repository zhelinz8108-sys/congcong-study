<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" style="max-width:360px" role="img" aria-label="以学校为中心的方位图：一条射线指向邮局，与正北方向的夹角标注 35°，偏向西，射线旁标注 600 米" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
