<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" width="100%" style="max-width:300px" role="img" aria-label="线段比例尺：每一段长 1 厘米，刻度依次是 0、30、60、90 千米" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="300" height="110" fill="#ffffff"/>
<line x1="40" y1="60" x2="220" y2="60" stroke="#1f2937" stroke-width="1.5"/>
<line x1="40" y1="55" x2="40" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="40" y="51" font-size="12" text-anchor="middle" fill="#1f2937">0</text>
<line x1="100" y1="55" x2="100" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="100" y="51" font-size="12" text-anchor="middle" fill="#1f2937">30</text>
<line x1="160" y1="55" x2="160" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="160" y="51" font-size="12" text-anchor="middle" fill="#1f2937">60</text>
<line x1="220" y1="55" x2="220" y2="60" stroke="#1f2937" stroke-width="1.5"/><text x="220" y="51" font-size="12" text-anchor="middle" fill="#1f2937">90 千米</text>
<text x="130.0" y="90.0" font-size="12" text-anchor="middle" fill="#475569">每一段长 1 厘米</text>
</svg>