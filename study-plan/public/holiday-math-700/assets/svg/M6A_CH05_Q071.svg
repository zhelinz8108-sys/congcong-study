<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 250" width="100%" style="max-width:260px" role="img" aria-label="圆 O 内画了一个四个顶点都在圆上的正方形，正方形的两条对角线用虚线画出，半径标注 3 厘米，圆内正方形外的部分涂色" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="260" height="250" fill="#ffffff"/>
<circle cx="130.0" cy="120.0" r="100.0" fill="#cbd5e1" stroke="#2563eb" stroke-width="2"/>
<polygon points="130.0,20.0 230.0,120.0 130.0,220.0 30.0,120.0" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<line x1="30.0" y1="120.0" x2="230.0" y2="120.0" stroke="#2563eb" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="130.0" y1="20.0" x2="130.0" y2="220.0" stroke="#2563eb" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="130.0" cy="120.0" r="3" fill="#1f2937"/>
<text x="135.0" y="114.0" font-size="14" fill="#1f2937">O</text>
<text x="180.0" y="136.0" font-size="13" text-anchor="middle" fill="#1f2937">3 厘米</text>
</svg>