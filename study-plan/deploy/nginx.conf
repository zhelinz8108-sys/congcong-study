# Document navigations must never receive a prefetched React payload.
map "$http_sec_fetch_mode:$http_sec_fetch_dest" $study_plan_document_navigation {
    default 0;
    ~^navigate: 1;
    ~:document$ 1;
}

map $study_plan_document_navigation $study_plan_rsc {
    default $http_rsc;
    1 "";
}
map $study_plan_document_navigation $study_plan_router_state {
    default $http_next_router_state_tree;
    1 "";
}
map $study_plan_document_navigation $study_plan_prefetch {
    default $http_next_router_prefetch;
    1 "";
}
map $study_plan_document_navigation $study_plan_segment_prefetch {
    default $http_next_router_segment_prefetch;
    1 "";
}

server {
    listen 80;
    listen [::]:80;
    server_name congcong-study.cn 124.223.31.175;

    client_max_body_size 250m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Compatibility path for files uploaded before cloud-storage routing was added.
    location /uploads/ {
        alias /var/lib/study-plan/uploads/study-uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep client-side fetches intact; strip prefetch markers only on navigation.
        proxy_set_header RSC $study_plan_rsc;
        proxy_set_header Next-Router-State-Tree $study_plan_router_state;
        proxy_set_header Next-Router-Prefetch $study_plan_prefetch;
        proxy_set_header Next-Router-Segment-Prefetch $study_plan_segment_prefetch;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
